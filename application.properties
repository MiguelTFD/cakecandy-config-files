# Nombre de la aplicación
spring.application.name=global-config

# Datasource MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/cakebd
spring.datasource.username=root
spring.datasource.password=mysql

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Puerto del servidor
server.port=0

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# Logging
logging.file.name=${spring.application.name}.log
logging.level.root=INFO

# App queue
app.queue.name=log-queue

# Management endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Resilience4j CircuitBreaker
resilience4j.circuitbreaker.instances.adminCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.adminCB.sliding-window-type=count-based
resilience4j.circuitbreaker.instances.adminCB.sliding-window-size=9
resilience4j.circuitbreaker.instances.adminCB.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.adminCB.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.adminCB.max-wait-duration-in-half-open-state=21s
resilience4j.circuitbreaker.instances.adminCB.permitted-number-of-calls-in-half-open-state=3

# Resilience4j Retry
resilience4j.retry.instances.adminCB.max-attempts=6
resilience4j.retry.instances.adminCB.wait-duration=1s
